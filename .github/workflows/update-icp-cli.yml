# A GitHub Actions workflow that regularly checks for new versions of icp-cli
# and of the network launcher (which contains PocketIC and so decides the NNS
# version of local networks) and creates a PR on new versions.
name: Update icp-cli
on:
  schedule:
    # check for new versions weekly
    - cron: '30 3 * * FRI'
  workflow_dispatch:
  # Provide an option to run this manually.
  push:
    branches:
      # Development branch for this workflow:
      - "update-icp-cli"
jobs:
  update-icp-cli:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Create GitHub App Token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        id: app-token
        with:
          app-id: ${{ vars.PR_AUTOMATION_BOT_PUBLIC_APP_ID }}
          private-key: ${{ secrets.PR_AUTOMATION_BOT_PUBLIC_PRIVATE_KEY }}
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        # Check for new versions.  The versions of the tools are in mise.toml.
      - name: Check new icp-cli and network launcher versions
        id: update
        run: |
          set -euo pipefail
          current_icp_cli="$(sed -nE 's/^"npm:@icp-sdk\/icp-cli" = "([^"]+)".*/\1/p' mise.toml)"
          current_launcher="$(sed -nE '/^\[tools\."http:icp-cli-network-launcher"\]/,/^$/s/^version = "([^"]+)".*/\1/p' mise.toml)"
          echo "Current icp-cli: '$current_icp_cli'"
          echo "Current network launcher: '$current_launcher'"
          latest_icp_cli="$(npm view @icp-sdk/icp-cli version)"
          latest_launcher="$(gh api repos/dfinity/icp-cli-network-launcher/releases/latest --jq .tag_name)"
          latest_launcher="${latest_launcher#v}"
          echo "Latest icp-cli: '$latest_icp_cli'"
          echo "Latest network launcher: '$latest_launcher'"
          test -n "$current_icp_cli" && test -n "$current_launcher" && test -n "$latest_icp_cli" && test -n "$latest_launcher"

          updates=()
          if [ "$current_icp_cli" != "$latest_icp_cli" ]
          then
            sed -i -E "s|^(\"npm:@icp-sdk/icp-cli\" = )\"[^\"]+\"|\1\"$latest_icp_cli\"|" mise.toml
            updates+=("icp-cli $latest_icp_cli")
          fi
          if [ "$current_launcher" != "$latest_launcher" ]
          then
            sed -i -E "/^\[tools\.\"http:icp-cli-network-launcher\"\]/,/^$/s|^version = \"[^\"]+\"|version = \"$latest_launcher\"|" mise.toml
            updates+=("network launcher $latest_launcher")
          fi

          if [ "${#updates[@]}" -gt 0 ]
          then
            echo An update is available.
            git diff
            echo "updated=1" >> "$GITHUB_OUTPUT"
            echo "title=bot: Update $(IFS=,; echo "${updates[*]}" | sed 's/,/ and /')" >> "$GITHUB_OUTPUT"
          else
            echo "updated=0" >> "$GITHUB_OUTPUT"
          fi
        # If a newer version is available, create a PR.
      - name: Create Pull Request
        if: ${{ steps.update.outputs.updated == '1' }}
        uses: peter-evans/create-pull-request@38e0b6e68b4c852a5500a94740f0e535e0d7ba54 # v4.2.4
        with:
          token: ${{ steps.app-token.outputs.token }}
          base: main
          add-paths: |
            mise.toml
          commit-message: ${{ steps.update.outputs.title }}
          committer: GitHub <noreply@github.com>
          author: gix-bot <gix-bot@users.noreply.github.com>
          branch: bot-icp-cli-update
          branch-suffix: timestamp
          delete-branch: true
          title: ${{ steps.update.outputs.title }}
          # Since the this is a scheduled job, a failure won't be shown on any
          # PR status. To notify the team, we send a message to our Slack channel on failure.
      - name: Notify Slack on failure
        uses: dfinity/internet-identity/.github/actions/slack@b278eab440b6adfcb561f18fe24bdea66c1987c3 # release-2023-08-28
        if: ${{ failure() }}
        with:
          WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          MESSAGE: "icp-cli update failed"
