# The tools that the scripts in bin/ need, installed with `mise install`, see https://mise.jdx.dev
#
# Not managed by mise, because they are standard on CI runners and developer
# machines: bash, curl, jq, openssl, perl, gh and sponge (from moreutils).
# `bin/dfx-sns-demo-install` installs these with the system package manager.
#
# The ic-admin and sns executables are not here because they come from a
# specific IC commit (DFX_IC_COMMIT in bin/versions.bash), see
# `bin/dfx-software ic install-executable`.

[tools]
node = "22"

# icp-cli replaces dfx.  It is a Rust binary that is distributed through npm.
"npm:@icp-sdk/icp-cli" = "1.6.0"

# Wasm tooling: used by bin/wasm-nm and the scripts that fetch wasms from CI.
# cargo-binstall makes mise download a prebuilt ic-wasm instead of compiling it.
cargo-binstall = "1.3.0"
"cargo:ic-wasm" = "0.6.0"

# The network launcher is PocketIC with a thin wrapper that icp-cli drives.
# It decides the versions of the NNS canisters in a local network, so updating
# it updates the NNS.  The launcher is pinned here rather than in icp.yaml so
# that there is just one place to look for versions of tools.
[tools."http:icp-cli-network-launcher"]
version = "16.0.0-2026-09-25-03-28"
platforms.linux-x64 = { url = "https://github.com/dfinity/icp-cli-network-launcher/releases/download/v{{version}}/icp-cli-network-launcher-x86_64-linux-v{{version}}.tar.gz" }
platforms.linux-arm64 = { url = "https://github.com/dfinity/icp-cli-network-launcher/releases/download/v{{version}}/icp-cli-network-launcher-arm64-linux-v{{version}}.tar.gz" }
platforms.macos-x64 = { url = "https://github.com/dfinity/icp-cli-network-launcher/releases/download/v{{version}}/icp-cli-network-launcher-x86_64-darwin-v{{version}}.tar.gz" }
platforms.macos-arm64 = { url = "https://github.com/dfinity/icp-cli-network-launcher/releases/download/v{{version}}/icp-cli-network-launcher-arm64-darwin-v{{version}}.tar.gz" }

# Sends signed messages to the NNS, for example to stake a neuron.
[tools."http:quill"]
version = "0.5.3"
rename_exe = "quill"
platforms.linux-x64 = { url = "https://github.com/dfinity/quill/releases/download/v{{version}}/quill-linux-x86_64" }
# There is no native build for arm64.
platforms.macos-x64 = { url = "https://github.com/dfinity/quill/releases/download/v{{version}}/quill-macos-x86_64" }
platforms.macos-arm64 = { url = "https://github.com/dfinity/quill/releases/download/v{{version}}/quill-macos-x86_64" }

# Converts Candid to JSON.
[tools."http:idl2json"]
version = "0.8.5"
platforms.linux-x64 = { url = "https://github.com/dfinity/idl2json/releases/download/v{{version}}/idl2json-linux-x86_64.tar.gz" }
platforms.macos-x64 = { url = "https://github.com/dfinity/idl2json/releases/download/v{{version}}/idl2json-macos-x86_64.zip" }
platforms.macos-arm64 = { url = "https://github.com/dfinity/idl2json/releases/download/v{{version}}/idl2json-macos-x86_64.zip" }

# Encodes Candid.  The version is the date of the release.
[tools."http:didc"]
version = "2023-07-25"
rename_exe = "didc"
platforms.linux-x64 = { url = "https://github.com/dfinity/candid/releases/download/{{version}}/didc-linux64" }
platforms.macos-x64 = { url = "https://github.com/dfinity/candid/releases/download/{{version}}/didc-macos" }
platforms.macos-arm64 = { url = "https://github.com/dfinity/candid/releases/download/{{version}}/didc-macos" }

[settings]
# Downloads from GitHub releases sometimes fail with a transient server error.
http_retries = 6
